<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web</title>
</head>
<style>
    h1{
        text-align: center;
    }
    html{
        background-color: aliceblue;
    }
</style>
<body>
    <h1>Atividade 02</h1>
    <hr>
    <p>
        Um buffet cobra R$ 85,00 por pessoa para fornecer alimentação durante um evento. Crie variáveis para armazenar a quantidade de convidados e calcule o valor total do buffet.
    </p>

    <p id="Resultado"></p>

    <script>
        // Entradas:
        let valor = 85.00;
        let qtdconvidados = 120;

        // Cálculo:
        let resultado = valor * qtdconvidados;

        // Resultado:
        document.write("O valor total é R$ " + resultado + ",00");
    </script>
</body>
</html>
