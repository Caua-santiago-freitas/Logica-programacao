<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web</title>
</head>
<style>
    h1{
        text-align: center;
    }
    html{
        background-color: aliceblue;
    }
</style>
<body>
    <h1>Atividade 01</h1>
    <hr>
    <p>
        Uma empresa organiza eventos e cobra R$ 180,00 por participante. Crie variáveis para armazenar a quantidade de participantes e calcule o valor total doorçamento do evento.
    </p>

    <p id="Resultado"></p>

    <script>
        // Entradas:
        let valortotal = 180.00;
        let qtdparticipantes = 40;

        // Cálculo:
        let resultado = valortotal * qtdparticipantes;
        
        //Resultado:
        document.write("O valor total é R$ " + resultado + ",00");
        
    </script>
</body>
</html>
